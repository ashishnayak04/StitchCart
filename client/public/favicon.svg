<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Definitions for luxury gold gradients and soft glows -->
  <defs>
    <!-- Background luxury gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3A332E" />
      <stop offset="60%" stop-color="#241E1A" />
      <stop offset="100%" stop-color="#14100D" />
    </radialGradient>

    <!-- Gold metallic gradient -->
    <linearGradient id="goldGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F3E5C8" />
      <stop offset="25%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#B99B6B" />
      <stop offset="75%" stop-color="#E2C68A" />
      <stop offset="100%" stop-color="#997841" />
    </linearGradient>

    <!-- Subtle inner border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C68A" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#B99B6B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E2C68A" stop-opacity="0.5" />
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#B99B6B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Rich Espresso Hue -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="url(#borderGrad)" stroke-width="4" fill="none" />

  <!-- The Sartorial "S" Needle & Stitch Loop Motif -->
  <g filter="url(#goldGlow)">
    <!-- Continuous Sartorial Flow Stitch S -->
    <path
      d="M344 168 C344 126 308 100 256 100 C194 100 156 138 156 186 C156 242 208 266 264 286 C322 306 356 328 356 376 C356 428 308 456 252 456 C190 456 148 422 148 376"
      stroke="url(#goldGrad)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Diagonal Tailor's Golden Needle intersecting the S -->
    <path
      d="M380 96 L132 344"
      stroke="url(#goldGrad)"
      stroke-width="18"
      stroke-linecap="round"
    />

    <!-- Needle Eye Hole -->
    <ellipse
      cx="354"
      cy="122"
      rx="7"
      ry="14"
      transform="rotate(45 354 122)"
      fill="#1A1512"
      stroke="url(#goldGrad)"
      stroke-width="6"
    />

    <!-- Atelier Sparkle Star Accent Top Right -->
    <path
      d="M400 160 Q400 184 424 184 Q400 184 400 208 Q400 184 376 184 Q400 184 400 160 Z"
      fill="url(#goldGrad)"
    />

    <!-- Subtle Lower Sparkle -->
    <circle cx="168" cy="148" r="7" fill="url(#goldGrad)" />
    <circle cx="344" cy="408" r="7" fill="url(#goldGrad)" />
  </g>
</svg>
